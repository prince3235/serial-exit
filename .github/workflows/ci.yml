# Proves the site builds and boots on Linux with ZERO environment variables.
name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund --prefer-offline
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:assets
      - run: npm run build
      - name: Boot and smoke-test
        run: |
          PORT=8080 HOSTNAME=127.0.0.1 npm start &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health && break || sleep 1; done
          curl -sf http://127.0.0.1:8080/ -o /dev/null
          curl -sf http://127.0.0.1:8080/robots.txt -o /dev/null
          curl -sf http://127.0.0.1:8080/sitemap.xml -o /dev/null
          curl -sf http://127.0.0.1:8080/manifest.webmanifest -o /dev/null
